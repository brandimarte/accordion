<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accordion Chord Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
</head>
<body>
  <div id="audio-overlay">
    <button id="audio-enable">Click to enable audio</button>
  </div>
  <header>
    <h1>Accordion Chord Visualizer (120-bass Stradella)</h1>
  </header>

  <section id="controls">
    <label for="tone">Tone:</label>
    <select id="tone"></select>

    <label for="chord">Chord type:</label>
    <select id="chord">
      <option value="major">Major</option>
      <option value="minor">Minor</option>
      <option value="seventh">7</option>
      <option value="diminished">7-</option>
      <option value="maj7">7+</option>
      <option value="m7">m7</option>
      <option value="6">6</option>
      <option value="m6">m6</option>
      <option value="dim_triad">dim</option>
      <option value="7b5">m7b5</option>
      <option value="7(9)">7(9)</option>
      <option value="7(9)_var">7(9) var</option>
      <option value="m9">m9</option>
    </select>
    <button id="play-chord">Play Chord</button>
  </section>

  <section id="diagram">
    <svg id="accordion-svg"></svg>
  </section>

  <footer>
    <p>© 2025 Accordion Chord Visualizer — by <a href="https://brandimarte.github.io">Pedro Brandimarte</a></p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
